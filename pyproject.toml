[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "anatplot"
dynamic = ["version"]
description = "Simple anatomical surface scenes with PyVista"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "ipywidgets>=8.1.9",
    "matplotlib>=3.6",
    "nest-asyncio2>=1.7,<2",
    "neuromaps>=0.0.7,<0.1",
    "nibabel>=5",
    "nilearn>=0.12,<0.15",
    "numpy>=1.24",
    "pooch>=1.8,<2",
    "pyvista>=0.49,<0.50",
    "templateflow>=25.1,<26",
    "trame-pyvista>=0.2,<0.3",
]

[project.urls]
Repository = "https://github.com/const7/anatplot"
Documentation = "https://chenkun.me/anatplot/"
Issues = "https://github.com/const7/anatplot/issues"

[dependency-groups]
dev = [
    "ipykernel>=6",
    "pytest>=8",
    "ruff==0.17.0",
]
docs = [
    "markdown-exec>=1.12,<2",
    "mkdocstrings-python>=1,<3",
    "zensical>=0.0.47,<0.1",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["anatplot"]

[tool.hatch.version]
path = "anatplot/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/anatplot",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/AGENTS.md",
    "/zensical.toml",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = ["render: needs a working local VTK/OpenGL graphical context"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
